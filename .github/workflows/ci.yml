name: CI

on:
  push:
    branches: [main, risk-analysis]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @alliance-risk/shared build

      - name: Lint all packages
        run: pnpm lint

      - name: Build API package
        run: pnpm --filter @alliance-risk/api build
        env:
          # Required for Prisma generate to succeed without a live DB connection.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/alliance_risk

      - name: Build Web package
        run: pnpm --filter @alliance-risk/web build
        env:
          # Placeholder values for the static build — the actual runtime values
          # are injected during deploy-web.sh via CloudFormation stack outputs.
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_CI_PLACEHOLDER
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ci-placeholder-client-id

      - name: Run API tests
        run: pnpm --filter @alliance-risk/api test

      - name: Run Web tests
        run: pnpm --filter @alliance-risk/web test

      - name: Run infrastructure snapshot tests
        run: pnpm --filter @alliance-risk/infra test

  pnpm-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # report only until we're ready to gate on it

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod
